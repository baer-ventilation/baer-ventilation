<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baer Ventilation</title>
    <script>
        (function(){
            // 获取url参数，强制语言
            const params = new URLSearchParams(window.location.search);
            const forceLang = params.get('lang');

            if(forceLang === 'ar'){
                window.location.href = '/ar/index.html';
                return;
            }
            if(forceLang === 'zh'){
                window.location.href = '/zh/index.html';
                return;
            }

            // 获取浏览器语言
            let browserLang = navigator.language || navigator.userLanguage;
            browserLang = browserLang.toLowerCase();

            if(browserLang.startsWith('ar')){
                window.location.href = '/ar/index.html';
            }else{
                // 默认中文
                window.location.href = '/zh/index.html';
            }
        })();
    </script>
</head>
<body>
    <div style="text-align:center;margin-top:100px;font-family:system-ui;">
        <p>Redirecting... / إعادة التوجيه...</p>
        <p>
            <a href="/zh/index.html">中文</a> |
            <a href="/ar/index.html">العربية</a>
        </p>
    </div>
</body>
</html>
