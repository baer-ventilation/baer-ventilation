name: Add BAER Factory Video Showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baer-factory-video-once.yml'

permissions:
  contents: write

jobs:
  inject-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject factory video section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          if 'id="factory-video"' in html:
              print('Factory video section already exists; nothing to do.')
              raise SystemExit(0)

          marker = '<section class="section-padding" id="about">'
          if marker not in html:
              raise SystemExit('Could not find the About section marker; no changes were made.')

          block = r'''
<section class="baer-factory-video" id="factory-video">
  <div class="baer-factory-video__inner">
    <div class="baer-factory-video__heading">
      <span>INSIDE BAER FACTORY</span>
      <h2>SEE HOW BAER FANS ARE MADE</h2>
      <p>From manufacturing to quality control, discover the production capabilities behind BAER Ventilation.</p>
    </div>
    <div class="baer-factory-video__frame">
      <video class="baer-factory-video__media" autoplay muted loop playsinline preload="metadata" aria-label="BAER Ventilation factory tour">
        <source src="factory-tour-baer.mp4" type="video/mp4">
      </video>
      <div class="baer-factory-video__shade"></div>
      <div class="baer-factory-video__copy">
        <div class="baer-factory-video__eyebrow">MANUFACTURING · QUALITY · GLOBAL SUPPLY</div>
        <h3>Built for Reliable Ventilation</h3>
        <p>Explore our production environment, assembly lines, testing processes and finished-product warehouse.</p>
        <button type="button" class="baer-factory-video__play" aria-label="Play or pause factory video"><span class="play-icon">▶</span><span>PLAY / PAUSE</span></button>
      </div>
      <div class="baer-factory-video__progress"><span></span></div>
    </div>
  </div>
</section>
<style>
.baer-factory-video{padding:100px 0;background:#0b0b0c;color:#fff;overflow:hidden}
.baer-factory-video__inner{width:min(1400px,92%);margin:0 auto}
.baer-factory-video__heading{text-align:center;max-width:820px;margin:0 auto 38px}
.baer-factory-video__heading span{display:block;color:#e91d25;font-size:13px;font-weight:800;letter-spacing:2.5px;margin-bottom:13px}
.baer-factory-video__heading h2{margin:0;font-size:clamp(32px,4vw,58px);line-height:1.05;font-weight:800;letter-spacing:-1.5px}
.baer-factory-video__heading p{margin:18px auto 0;color:#a9a9ad;font-size:16px;line-height:1.7}
.baer-factory-video__frame{position:relative;aspect-ratio:1.987/1;background:#111;border-radius:2px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.baer-factory-video__media{width:100%;height:100%;display:block;object-fit:cover}
.baer-factory-video__shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.58) 0%,rgba(0,0,0,.18) 45%,rgba(0,0,0,.05) 100%),linear-gradient(0deg,rgba(0,0,0,.4),transparent 40%);pointer-events:none}
.baer-factory-video__copy{position:absolute;left:clamp(24px,5vw,72px);bottom:clamp(34px,6vw,72px);max-width:560px}
.baer-factory-video__eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;margin-bottom:13px}
.baer-factory-video__copy h3{font-size:clamp(28px,3.2vw,48px);line-height:1.05;margin:0 0 13px;font-weight:800}
.baer-factory-video__copy p{font-size:15px;line-height:1.65;color:rgba(255,255,255,.86);margin:0 0 22px;max-width:520px}
.baer-factory-video__play{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.22);color:#fff;padding:11px 16px;font-size:11px;font-weight:800;letter-spacing:1.2px;cursor:pointer;backdrop-filter:blur(6px)}
.baer-factory-video__play:hover{background:#e91d25;border-color:#e91d25}
.play-icon{font-size:12px}
.baer-factory-video__progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.16)}
.baer-factory-video__progress span{display:block;height:100%;width:0;background:#e91d25}
@media(max-width:700px){.baer-factory-video{padding:65px 0}.baer-factory-video__heading{text-align:left;margin-bottom:24px}.baer-factory-video__frame{aspect-ratio:16/10;border-radius:0}.baer-factory-video__shade{background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,.05) 70%)}.baer-factory-video__copy{left:22px;right:22px;bottom:28px}.baer-factory-video__copy p{font-size:13px;margin-bottom:15px}}
</style>
<script>
(function(){const s=document.querySelector('#factory-video');if(!s)return;const v=s.querySelector('video'),b=s.querySelector('.baer-factory-video__play'),p=s.querySelector('.baer-factory-video__progress span');b.addEventListener('click',()=>v.paused?v.play():v.pause());v.addEventListener('timeupdate',()=>{if(v.duration)p.style.width=(v.currentTime/v.duration*100)+'%'});})();
</script>

'''

          html = html.replace(marker, block + marker, 1)
          p.write_text(html, encoding='utf-8')
          print('Factory video section injected successfully.')
          PY

      - name: Commit homepage change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add BAER factory video showcase to homepage'
          git push
