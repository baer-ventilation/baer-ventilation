<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="canonical" href="https://baer-ventilation.com/zh/contact.html">
    <link rel="alternate" hreflang="zh-CN" href="https://baer-ventilation.com/zh/contact.html">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{color:#222;line-height:1.7;}
        .header{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;border-bottom:1px solid #eee;}
        .logo{font-size:22px;font-weight:bold;}
        nav a{margin:0 10px;text-decoration:none;color:#333;}
        .lang-switch a{padding:6px 12px;border:1px solid #222;border-radius:4px;text-decoration:none;color:#222;margin-left:8px;}
        .lang-switch a.active{background:#222;color:#fff;}
        .banner{background:#f7f9fa;padding:3rem 2rem;text-align:center;}
        .banner h1{font-size:32px;margin-bottom:10px;}
        .container{max-width:1100px;margin:0 auto;padding:3rem 2rem;display:grid;grid-template-columns:1fr 1fr;gap:3rem;}
        .info h2{margin-bottom:1rem;font-size:24px;}
        .info-item{margin-bottom:16px;}
        .info-item strong{display:block;margin-bottom:4px;}
        .form-item{margin-bottom:16px;}
        label{display:block;margin-bottom:4px;}
        input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:1rem;}
        textarea{min-height:120px;resize:vertical;}
        button{padding:12px 24px;background:#222;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:1rem;}
        .footer{background:#111;color:#fff;text-align:center;padding:2rem;margin-top:3rem;}
        @media(max-width:768px){
            .header{flex-direction:column;gap:12px;}
            .banner h1{font-size:24px;}
            .container{grid-template-columns:1fr;}
        }

</head>
<body>
<header class="header">
    <div class="logo">Baer Ventilation</div>
    <nav>
        <a href="index.html">首页</a>

        <a href="about.html">关于我们</a>
        <a href="contact.html">联系我们</a>
    </nav>
    <div class="lang-switch">
        <a href="contact.html" class="active">中文</a>
        <a href="../ar/contact.html">العربية</a>

<section class="banner">

</section>

<div class="container">

        <div class="info-item">
            <strong>邮箱</strong>
            <span>contact@baer‑ventilation.com</span>
        </div>
        <div class="info-item">
            <strong>WhatsApp</strong>
            <span>+86‑xxx‑xxxxxxx</span>
        </div>
        <div class="info-item">
            <strong>工厂地址</strong>
            <span>中国，浙江省</span>
        </div>
        <div class="info-item">
            <strong>工作时间</strong>
            <span>周一‑周五 08:30‑17:30 (GMT+8)</span>
        </div>
        <br>

    <div class="form-wrap">
        <h2>在线留言</h2>
        <div class="form-item">
            <label>姓名</label>
            <input type="text">
        </div>
        <div class="form-item">
            <label>邮箱</label>
            <input type="email">
        </div>
        <div class="form-item">
            <label>国家/公司</label>
            <input type="text">
        </div>
        <div class="form-item">
            <label>咨询内容</label>
            <textarea></textarea>
        </div>
        <button>提交留言</button>
    </div>
</div>

<footer class="footer">

</html>
