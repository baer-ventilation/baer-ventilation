<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 | BAER 通风设备</title>
  <meta name="description" content="BAER通风设备联系页面，欢迎咨询产品、报价、定制方案，留下您的需求，我们尽快回复。">
  <meta name="keywords" content="联系BAER,风机报价,通风设备咨询">
  <link rel="canonical" href="https://baer-ventilation.com/zh/contact.html">
  <link rel="alternate" hreflang="zh" href="https://baer-ventilation.com/zh/contact.html">
  <link rel="alternate" hreflang="ar" href="https://baer-ventilation.com/ar/contact.html">
  <link rel="alternate" hreflang="x-default" href="https://baer-ventilation.com/contact.html">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
    body{line-height:1.7;color:#333;}
    header{background:#1a2b48;color:#fff;padding:1rem 5%;display:flex;justify-content:space-between;align-items:center;}
    .logo{font-size:1.4rem;font-weight:bold;}
    nav a{color:#fff;margin:0 0.8rem;text-decoration:none;}
    .page-header{background:#f4f7fb;padding:2.5rem 5%;text-align:center;}
    .page-header h1{font-size:2rem;margin-bottom:0.5rem;}
    .container{max-width:1200px;margin:0 auto;padding:2.5rem 5%;}
    .contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;}
    @media(max-width:768px){.contact-wrap{grid-template-columns:1fr;}}
    .info-item{margin-bottom:1.2rem;}
    .info-item strong{display:block;margin-bottom:0.3rem;}
    form{border:1px solid #e2e8f0;padding:2rem;border-radius:8px;}
    .form-group{margin-bottom:1.2rem;}
    label{display:block;margin-bottom:0.4rem;}
    input,textarea{width:100%;padding:0.8rem;border:1px solid #ccc;border-radius:4px;font-size:1rem;}
    textarea{min-height:120px;resize:vertical;}
    button{background:#254b9c;color:#fff;border:none;padding:0.9rem 1.8rem;border-radius:4px;cursor:pointer;font-size:1rem;}
    footer{background:#1a2b48;color:#fff;padding:2rem 5%;margin-top:4rem;}
  </style>
</head>
<body>
<header>
  <div class="logo">BAER‑VENTILATION</div>
  <nav>
    <a href="./index.html">首页</a>
    <a href="./catalog.html">产品目录</a>
    <a href="./about.html">关于我们</a>
    <a href="./contact.html">联系我们</a>
    <a href="../ar/contact.html">العربية</a>
  </nav>
</header>

<section class="page-header">
  <h1>联系我们</h1>
  <p>欢迎咨询产品、报价与定制方案</p>
</section>

<div class="container">
  <div class="contact-wrap">
    <div>
      <h2>联系方式</h2>
      <div class="info-item">
        <strong>邮箱</strong>
        <span>info@baer‑ventilation.com</span>
      </div>
      <div class="info-item">
        <strong>业务咨询</strong>
        <span>请优先邮件沟通，我们会尽快回复</span>
      </div>
      <div class="info-item">
        <strong>地址</strong>
        <span>填写你的公司地址</span>
      </div>

      <div style="margin-top:2rem;">
        <h3>咨询提示</h3>
        <ul style="margin-left:1.2rem;line-height:2;">
          <li>告知工况、风量风压需求，方便快速选型报价</li>
          <li>可提供图纸或参数，支持非标设备定制</li>
        </ul>
      </div>
    </div>

    <div>
      <form>
        <div class="form-group">
          <label>您的姓名</label>
          <input type="text" name="name" placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" name="email" placeholder="用于接收回复">
        </div>
        <div class="form-group">
          <label>需求描述</label>
          <textarea name="message" placeholder="请描述产品需求、工况、参数等信息"></textarea>
        </div>
        <button type="submit">提交咨询</button>
      </form>
      <p style="font-size:0.85rem;color:#666;margin-top:0.8rem;">提示：静态页面表单仅UI展示，需要对接表单服务才可接收消息。</p>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 BAER‑VENTILATION. All rights reserved.</p>
  <p>邮箱：info@baer‑ventilation.com</p>
</footer>
</body>
</html>
