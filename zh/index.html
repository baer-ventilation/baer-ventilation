<!-- GA4 conversion events: WhatsApp / email / PDF catalog / phone / form -->
<script>
document.addEventListener('click', function(e){
  var t = e.target;
  while (t && t !== document.body && t.tagName !== 'A') { t = t.parentElement; }
  if (!t || t.tagName !== 'A' || typeof gtag !== 'function') return;
  var href = t.getAttribute('href') || '';
  if (/wa\.me|whatsapp/i.test(href)) { gtag('event', 'whatsapp_click'); }
  else if (href.indexOf('mailto:') === 0) { gtag('event', 'email_click'); }
  else if (/\.pdf(\?|$)/i.test(href)) { gtag('event', 'catalog_download'); }
  else if (href.indexOf('tel:') === 0) { gtag('event', 'phone_click'); }
});
var _baerForm = document.querySelector('form');
if (_baerForm) _baerForm.addEventListener('submit', function(){
  if (typeof gtag === 'function') gtag('event', 'inquiry_submit');
});
</script>
